<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Downloader</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⬇</text></svg>">
</head>
<body>
<script>
  // Runs before first paint: applying the stored theme in app.js (loaded at
  // the end of body) would flash the dark default first.
  try {
    var saved = localStorage.getItem('theme');
    if (saved === 'light' || saved === 'dark') {
      document.documentElement.dataset.theme = saved;
    }
  } catch (e) { /* storage blocked; keep the default */ }
</script>

<header class="topbar">
  <div class="brand">
    <svg class="brand-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M21.6 7.2a2.8 2.8 0 0 0-2-2C17.9 4.8 12 4.8 12 4.8s-5.9 0-7.6.4a2.8 2.8 0 0 0-2 2A29 29 0 0 0 2 12a29 29 0 0 0 .4 4.8 2.8 2.8 0 0 0 2 2c1.7.4 7.6.4 7.6.4s5.9 0 7.6-.4a2.8 2.8 0 0 0 2-2A29 29 0 0 0 22 12a29 29 0 0 0-.4-4.8z"/>
      <path class="brand-play" d="M10.2 15.3V8.7l5.4 3.3z"/>
    </svg>
    <h1>YouTube Downloader</h1>
  </div>
  <div class="topbar-right">
    <div class="version" id="version" title="versão do yt-dlp em uso"></div>
    <button type="button" class="theme-toggle" id="theme-toggle" title="Alternar tema">
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4.2"/>
        <path d="M12 2.4v2.6M12 19v2.6M4.2 4.2l1.9 1.9M17.9 17.9l1.9 1.9M2.4 12h2.6M19 12h2.6M4.2 19.8l1.9-1.9M17.9 6.1l1.9-1.9"/>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a8.6 8.6 0 1 0 11.1 11.1z"/>
      </svg>
    </button>
  </div>
</header>

<main>
  <section class="panel">
    <form id="download-form" autocomplete="off">
      <div class="url-row">
        <input
          type="url"
          id="url"
          name="url"
          placeholder="Cole a URL do vídeo ou playlist do YouTube"
          required
          spellcheck="false">
        <button type="submit" class="btn btn-primary" id="submit-btn">
          <span class="btn-label">Baixar</span>
        </button>
      </div>

      <div class="transcribe-bar">
        <label class="toggle">
          <input type="checkbox" id="transcribe" name="transcribe">
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
          <span class="toggle-text toggle-text-strong">Transcrever o áudio</span>
        </label>

        <div class="transcribe-settings" id="transcribe-settings" hidden>
          <select id="whisper_model" name="whisper_model" title="Modelo Whisper">
            <option value="tiny">tiny — mais rápido</option>
            <option value="base">base</option>
            <option value="small" selected>small — equilíbrio</option>
            <option value="medium">medium</option>
            <option value="large">large — melhor qualidade</option>
            <option value="turbo">turbo — rápido e preciso</option>
          </select>
          <select id="language" name="language" title="Idioma falado">
            <option value="pt" selected>Português</option>
            <option value="en">Inglês</option>
            <option value="es">Espanhol</option>
            <option value="fr">Francês</option>
            <option value="de">Alemão</option>
            <option value="it">Italiano</option>
            <option value="ja">Japonês</option>
            <option value="">Detectar idioma</option>
          </select>
        </div>

        <p class="transcribe-hint" id="transcribe-hint" hidden></p>
      </div>

      <div class="preview" id="preview" hidden>
        <img class="preview-thumb" id="preview-thumb" alt="">
        <div class="preview-meta">
          <p class="preview-title" id="preview-title"></p>
          <p class="preview-sub">
            <span id="preview-uploader"></span>
            <span class="dot">·</span>
            <span id="preview-duration"></span>
            <span id="preview-playlist" class="badge" hidden></span>
          </p>
        </div>
      </div>

      <div class="preview-error" id="preview-error" hidden></div>

      <details class="options" id="options">
        <summary>
          <span>Opções</span>
          <span class="options-summary" id="options-summary">1080p · vídeo</span>
        </summary>

        <div class="options-grid">
          <label class="field">
            <span class="field-label">Qualidade máxima</span>
            <select id="max_height" name="max_height">
              <option value="">Melhor disponível</option>
              <option value="2160">2160p (4K)</option>
              <option value="1440">1440p (2K)</option>
              <option value="1080" selected>1080p (Full HD)</option>
              <option value="720">720p (HD)</option>
              <option value="480">480p</option>
              <option value="360">360p</option>
            </select>
          </label>

          <label class="field">
            <span class="field-label">Formato de áudio</span>
            <select id="audio_format" name="audio_format" disabled>
              <option value="mp3" selected>MP3</option>
              <option value="m4a">M4A</option>
              <option value="opus">Opus</option>
              <option value="flac">FLAC</option>
              <option value="wav">WAV</option>
            </select>
          </label>

          <label class="field field-wide">
            <span class="field-label">Pasta de destino</span>
            <input
              type="text"
              id="output_path"
              name="output_path"
              placeholder="./videos"
              spellcheck="false">
          </label>
        </div>

        <div class="toggles">
          <label class="toggle">
            <input type="checkbox" id="audio_only" name="audio_only">
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
            <span class="toggle-text">Somente áudio</span>
          </label>
          <label class="toggle">
            <input type="checkbox" id="playlist" name="playlist">
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
            <span class="toggle-text">Baixar playlist inteira</span>
          </label>
          <label class="toggle">
            <input type="checkbox" id="subtitles" name="subtitles">
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
            <span class="toggle-text">Legendas</span>
          </label>
          <label class="toggle">
            <input type="checkbox" id="thumbnail" name="thumbnail">
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
            <span class="toggle-text">Embutir capa</span>
          </label>
          <label class="toggle">
            <input type="checkbox" id="overwrite" name="overwrite">
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
            <span class="toggle-text">Sobrescrever</span>
          </label>
        </div>
      </details>
    </form>

    <div class="dropzone" id="dropzone">
      <input type="file" id="file-input" accept="audio/*,video/*" hidden>
      <svg class="dropzone-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 16V4m0 0L8 8m4-4 4 4"/>
        <path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>
      </svg>
      <p class="dropzone-text">
        ou <button type="button" class="linkish" id="browse-btn">escolha um arquivo</button>
        do computador para transcrever
      </p>
      <p class="dropzone-sub">arraste um vídeo ou áudio para qualquer lugar da página</p>
    </div>
  </section>

  <section class="queue">
    <div class="queue-head">
      <h2>Downloads</h2>
      <button type="button" class="btn btn-ghost" id="clear-btn" hidden>Limpar concluídos</button>
    </div>

    <div id="jobs"></div>

    <p class="empty" id="empty">
      Nenhum download ainda. Cole uma URL acima para começar.
    </p>
  </section>
</main>

<template id="job-template">
  <article class="job" data-status="queued">
    <img class="job-thumb" alt="" hidden>
    <div class="job-body">
      <div class="job-head">
        <p class="job-title">Carregando…</p>
        <span class="job-status"></span>
      </div>
      <p class="job-sub"></p>
      <div class="progress">
        <div class="progress-bar"></div>
      </div>
      <div class="job-foot">
        <span class="job-stats"></span>
        <span class="job-actions">
          <a class="btn btn-small btn-save" hidden>Salvar arquivo</a>
          <a class="btn btn-small btn-transcript" hidden>Baixar .txt</a>
          <button type="button" class="btn btn-small btn-cancel">Cancelar</button>
        </span>
      </div>
      <p class="job-transcript" hidden></p>
      <p class="job-error" hidden></p>
    </div>
  </article>
</template>

<script src="/app.js"></script>
</body>
</html>
