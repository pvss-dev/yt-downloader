# yt-downloader — proxy reverso, acesso público.
#
# ANTES de ativar este arquivo, emita o certificado do subdomínio. O bloco
# HTTPS abaixo referencia um certificado que ainda não existe, e o nginx se
# recusa a subir sem ele — derrubando também pvss.dev.br.
#
#   1. Aponte yt.pvss.dev.br (A/AAAA) para o IP da VPS
#   2. Comente o bloco `server` de HTTPS deste arquivo
#   3. docker exec nginx nginx -s reload
#   4. docker compose run --rm certbot certonly --webroot \
#        -w /var/www/certbot -d yt.pvss.dev.br
#   5. Descomente o bloco HTTPS e recarregue de novo
#
# O que protege a VPS, já que o acesso é aberto:
#   - rate limiting e limite de conexões, abaixo
#   - YTDL_PUBLIC=1 no container (pasta fixa, cota por sessão)
#   - a limpeza automática, que impede o disco de encher
#
# Cada visitante enxerga só os próprios downloads (o app isola por cookie).
# Isso é separação, não autenticação: não impede ninguém de usar.

# Zonas de limite. Ficam fora de server{} porque a memória é compartilhada
# entre os workers; 10m guarda cerca de 160 mil endereços.
limit_req_zone  $binary_remote_addr zone=ytdl_api:10m  rate=30r/m;
limit_req_zone  $binary_remote_addr zone=ytdl_jobs:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=ytdl_conn:10m;

# Bloco HTTP: desafio ACME e redirecionamento para HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name yt.pvss.dev.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name yt.pvss.dev.br;

    ssl_certificate     /etc/letsencrypt/live/yt.pvss.dev.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yt.pvss.dev.br/privkey.pem;
    include              /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam          /etc/letsencrypt/ssl-dhparams.pem;

    # DNS interno do Docker. Resolver por variável adia a busca para a hora da
    # requisição; um bloco `upstream` estático é resolvido na inicialização, e
    # o nginx inteiro — inclusive pvss.dev.br — se recusaria a subir sempre que
    # o container da app estivesse parado.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $ytdl http://yt-downloader:8000;

    # Um stream SSE segura a conexão durante todo o job, então este limite
    # também limita quantos jobs um mesmo endereço acompanha ao mesmo tempo.
    limit_conn ytdl_conn 12;

    limit_req_status  429;
    limit_conn_status 429;

    # Uploads para transcrição. O app corta um arquivo em 4 GB; o padrão do
    # nginx é 1 MB e rejeitaria qualquer arquivo real com 413.
    client_max_body_size 4g;
    client_body_timeout  300s;

    # Baixar um vídeo longo e depois transcrevê-lo passa fácil dos 60s padrão.
    proxy_read_timeout   3600s;
    proxy_send_timeout   3600s;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass $ytdl$request_uri;
    }

    # Começar trabalho é o caminho caro: cada um custa um download e talvez uma
    # rodada de Whisper. Bem mais apertado que carregar a página.
    location = /api/download {
        limit_req zone=ytdl_jobs burst=3 nodelay;
        proxy_pass $ytdl$request_uri;
    }

    location = /api/upload {
        limit_req zone=ytdl_jobs burst=2 nodelay;
        proxy_pass $ytdl$request_uri;
    }

    # O preview dispara a cada colagem no campo de URL.
    location = /api/info {
        limit_req zone=ytdl_api burst=10 nodelay;
        proxy_pass $ytdl$request_uri;
    }

    # `location /api/jobs/` (com barra) faz o nginx devolver 301 para a forma
    # sem barra -- e um DELETE redirecionado vira GET, quebrando silenciosamente
    # a limpeza da lista. Um match exato tem precedência e evita o redirect.
    location = /api/jobs {
        proxy_pass $ytdl$request_uri;
    }

    # O progresso chega por Server-Sent Events. Com o buffering padrão do
    # nginx o stream inteiro fica retido até terminar, e a barra ficaria em 0%
    # até pular para 100%. Estas três linhas são o que faz o progresso ao vivo
    # funcionar através do proxy.
    #
    # Sem limit_req aqui: reconectar a um stream já aberto não é abuso, e uma
    # reconexão recusada congelaria a barra de um job em andamento.
    location /api/jobs/ {
        proxy_pass $ytdl$request_uri;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        proxy_read_timeout 24h;
    }
}
