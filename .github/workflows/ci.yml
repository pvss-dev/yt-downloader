name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: pvssdev/yt-downloader

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg

      - name: Install dependencies
        # The suite never touches the network or Whisper, so the heavy
        # transcribe extra is not needed to run it.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run tests
        run: pytest -q

  build:
    name: Build and publish
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # A missing secret makes the login step fail with an opaque error; say
      # what is actually wrong instead.
      - name: Check the publishing credentials
        if: github.event_name == 'push'
        run: |
          missing=""
          [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] || missing="$missing DOCKERHUB_USERNAME"
          [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]    || missing="$missing DOCKERHUB_TOKEN"
          if [ -n "$missing" ]; then
            echo "Missing repository secret(s):$missing" >&2
            echo "Add them in Settings > Secrets and variables > Actions." >&2
            echo "The token comes from Docker Hub > Account Settings >" >&2
            echo "Personal access tokens, with Read & Write permission." >&2
            exit 1
          fi
          echo "Credentials are present."

      # Pull requests only prove the image builds; nothing is published.
      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Without this the ~3 GB PyTorch layer is rebuilt on every run.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update the Docker Hub description
        # Keeps the README on Docker Hub in step with the repository, so the
        # page people land on is never a stale copy.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE }}
          short-description: "Baixe vídeos do YouTube e transcreva com Whisper, por CLI ou navegador"
