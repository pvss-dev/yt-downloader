name: Deploy

# Runs automatically after CI succeeds on main (see ci.yml), and manually for
# rollbacks -- dispatch it with an older `sha-<commit>` tag to go back.
#
# Note that any deploy restarts the container, which kills a download or
# transcription in flight. Add "Required reviewers" to the production
# environment if you would rather approve each one.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: false
        default: latest
      restart:
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy"
        required: true
        default: latest
      restart:
        description: "Recreate the container even if the tag is unchanged"
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check the deploy configuration
        run: |
          missing=""
          [ -n "${{ secrets.VPS_HOST }}" ]    || missing="$missing VPS_HOST(secret)"
          [ -n "${{ secrets.VPS_SSH_KEY }}" ] || missing="$missing VPS_SSH_KEY(secret)"
          [ -n "${{ vars.VPS_USER }}" ]       || missing="$missing VPS_USER(variable)"
          [ -n "${{ vars.VPS_APP_DIR }}" ]    || missing="$missing VPS_APP_DIR(variable)"
          if [ -n "$missing" ]; then
            echo "Missing in the 'production' environment:$missing" >&2
            echo "Settings > Environments > production" >&2
            exit 1
          fi
          echo "Configuration looks complete."

      - uses: actions/checkout@v5

      - name: Ensure the app directory exists
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: mkdir -p "${{ vars.VPS_APP_DIR }}"

      # The VPS holds no clone, so the compose file has to travel with the
      # deploy. Without this it would drift: changes to volumes, limits or env
      # vars would sit in the repo and never reach the server.
      - name: Copy docker-compose.yml to the VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: docker-compose.yml
          target: ${{ vars.VPS_APP_DIR }}
          overwrite: true

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          # Secrets for anything that grants access; variables for the rest,
          # because GitHub masks every secret in the logs and a deploy that
          # prints "==> Updating ***" is a deploy you cannot debug.
          host: ${{ secrets.VPS_HOST }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ vars.VPS_USER }}
          # `set -euo pipefail` on the first line below is what aborts on the
          # first failing command. (v1 of this action dropped the old
          # `script_stops` input, which did the same thing.)
          script: |
            set -euo pipefail

            APP_DIR="${{ vars.VPS_APP_DIR }}"
            IMAGE="ghcr.io/${{ github.repository }}:${{ inputs.tag }}"

            # A missing secret or variable arrives as an empty string, which
            # would turn `cd "$APP_DIR"` into a silent cd to $HOME. Say which
            # one is missing instead.
            if [ -z "$APP_DIR" ]; then
              echo "VPS_APP_DIR is not set. Add it as an environment VARIABLE" >&2
              echo "in Settings > Environments > production." >&2
              exit 1
            fi

            cd "$APP_DIR"

            # The image is a public package, so `docker pull` needs no login.
            # Making it private again would require restoring a docker login
            # step here with a read:packages token.

            echo "==> Pulling $IMAGE"
            docker pull "$IMAGE"

            echo "==> Recording the current image for rollback"
            PREVIOUS=$(docker inspect --format '{{.Config.Image}}' yt-downloader 2>/dev/null || echo "none")
            echo "previous image: $PREVIOUS"

            echo "==> Starting"
            export YTDL_IMAGE="$IMAGE"
            docker compose up -d ${{ inputs.restart && '--force-recreate' || '' }}

            echo "==> Waiting for the health check"
            for i in $(seq 1 30); do
              STATUS=$(docker inspect --format '{{.State.Health.Status}}' yt-downloader 2>/dev/null || echo starting)
              if [ "$STATUS" = "healthy" ]; then
                echo "healthy after ${i}0s"
                docker image prune -f --filter "until=168h" || true
                exit 0
              fi
              if [ "$STATUS" = "unhealthy" ]; then
                break
              fi
              sleep 10
            done

            echo "==> Deploy did not become healthy; rolling back to $PREVIOUS"
            docker logs --tail 50 yt-downloader || true
            if [ "$PREVIOUS" != "none" ]; then
              export YTDL_IMAGE="$PREVIOUS"
              docker compose up -d --force-recreate
            fi
            exit 1
