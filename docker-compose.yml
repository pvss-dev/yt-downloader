# Roda a aplicação localmente, sem instalar Python, ffmpeg ou Whisper na sua
# máquina:
#
#   docker compose up -d      # http://127.0.0.1:8000
#   docker compose logs -f
#   docker compose down
#
services:
  yt-downloader:
    image: ${YTDL_IMAGE:-pvssdev/yt-downloader:latest}
    container_name: yt-downloader
    restart: unless-stopped

    # A imagem roda como um usuário sem privilégios (uid 10001). As pastas
    # abaixo pertencem a você no host, e um bind mount preserva essa dona --
    # então o container precisa rodar com o SEU uid, ou não consegue escrever
    # e todo download falha com "Permission denied".
    #
    # 1000:1000 atende o primeiro usuário da maioria das instalações Linux.
    # Se o seu for outro, rode `id -u` e `id -g` e ajuste num arquivo .env:
    #   UID=1001
    #   GID=1001
    user: "${UID:-1000}:${GID:-1000}"

    # Só na interface de loopback: a aplicação não tem autenticação, e
    # publicar em 0.0.0.0 a exporia para toda a sua rede local.
    ports:
      - "127.0.0.1:${YTDL_PORT:-8000}:8000"

    environment:
      # Confina qualquer pasta de destino pedida pelo navegador a este
      # diretório, que é a pasta ./videos do host.
      YTDL_OUTPUT_ROOT: /data/videos
      XDG_CACHE_HOME: /data/cache

    volumes:
      # É aqui que os vídeos e transcrições aparecem para você.
      - ./videos:/data/videos
      # Pesos do Whisper (~500 MB para o `small`). Sem isto, todo restart do
      # container baixa o modelo de novo.
      - ./.whisper-cache:/data/cache

    # Whisper na CPU consome bastante memória; sem um teto, uma transcrição
    # pode jogar a máquina inteira em swap.
    deploy:
      resources:
        limits:
          memory: ${YTDL_MEMORY_LIMIT:-4g}
